<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 24px) 14px;max-width:720px;margin:0 auto}
h1{font-size:20px;margin:18px 0 2px;color:#2dd4bf}
.sub{font-size:13px;color:#8b949e;margin:0 0 12px}
.bar{height:8px;background:#161b22;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#2dd4bf,#a78bfa);transition:width .3s}
.stats{font-size:12px;color:#8b949e;display:flex;justify-content:space-between;margin-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:7px 12px;border-radius:18px;font-size:13px;cursor:pointer}
.tab.on{background:#2dd4bf;color:#0d1117;border-color:#2dd4bf;font-weight:600}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools button{flex:1;background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:9px;border-radius:10px;font-size:13px;cursor:pointer}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:18px;min-height:330px;cursor:pointer;position:relative}
.chip{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#a78bfa;border:1px solid #a78bfa;border-radius:10px;padding:2px 9px;margin-bottom:12px}
.q{font-size:20px;font-weight:600;color:#f0f6fc;margin:6px 0 14px}
.hint{font-size:13px;color:#8b949e;margin-top:18px}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
.weak .lab{color:#f85149}
.good .lab{color:#2dd4bf}
.weak p{margin:0;color:#8b949e;text-decoration:line-through;text-decoration-color:#f8514988;font-size:15px}
.good p{margin:0;color:#e6edf3;font-size:15.5px;background:#0f2a2a;border-left:3px solid #2dd4bf;padding:10px 12px;border-radius:6px}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1;padding:13px 6px;border-radius:12px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:14px;cursor:pointer}
.nav .know{background:#12261e;border-color:#238636;color:#56d364}
.nav .rev{background:#2b1a1a;border-color:#da3633;color:#ff7b72}
.count{text-align:center;font-size:12px;color:#8b949e;margin-top:10px}
.mark{position:absolute;top:14px;right:14px;font-size:12px}
.mark.k{color:#56d364}
.mark.r{color:#ff7b72}
.empty{padding:40px 10px;text-align:center;color:#8b949e}
</style>

<script>
var T={P1:"Pure Book 1",P2A:"Pure 2 Ch 1-4",P2B:"Pure 2 Ch 5-9",ST:"Statistics",ME:"Mechanics",SK:"Proof and communication"};
var C=[
["P1","Quadratic inequality","x^2 - 5x + 6 < 0 so x < 2 or x < 3.","Solve x^2 - 5x + 6 = 0: (x - 2)(x - 3) = 0, critical values 2 and 3. The graph is a U-shape, below the axis between the roots, so 2 < x < 3."],
["P1","Discriminant","It has no answers.","b^2 - 4ac < 0, so the equation has no real roots (the curve does not cross the x-axis). b^2 - 4ac = 0 gives equal roots (the curve touches the axis); b^2 - 4ac > 0 gives two distinct real roots."],
["P1","Find k for equal roots","Put the numbers in and get k.","For equal roots b^2 - 4ac = 0. Substitute the coefficients in terms of k, form and solve the equation for k, and state each value of k."],
["P1","Simultaneous equations (linear and quadratic)","Gets x and stops.","Rearrange the linear equation for y, substitute into the quadratic, simplify to a quadratic in x and solve. Substitute each x back into the linear equation to find y and write the coordinates as pairs."],
["P1","Circle: centre and radius","The middle is (3, 2).","Complete the square: (x - 3)^2 + (y + 2)^2 = 25, so the centre is (3, -2) and the radius is 5."],
["P1","Tangent to a circle","The line touches the circle.","The radius is perpendicular to the tangent. Gradient of radius = (y2 - y1)/(x2 - x1), gradient of tangent = -1 / gradient of radius. Use y - y1 = m(x - x1) at the point of contact."],
["P1","Differentiation from first principles","Writes f'(x) = 2x straight away.","f'(x) = lim as h tends to 0 of [f(x + h) - f(x)]/h. Expand f(x + h), simplify, divide by h, then let h tend to 0 to obtain f'(x)."],
["P1","Stationary points","Differentiate and find x.","Stationary points occur where dy/dx = 0. Solve for x, substitute into y to find the full coordinates."],
["P1","Nature of a stationary point","It is a minimum.","Find d2y/dx2 at x = 2: d2y/dx2 = 6 > 0, so the point is a minimum. (If d2y/dx2 < 0 it is a maximum.) If it equals 0 check the gradient either side."],
["P1","Tangent and normal","Uses the gradient of the curve as the normal gradient.","Differentiate, substitute x to find the gradient m of the tangent, find y. Tangent: y - y1 = m(x - x1). Normal gradient = -1/m, so the normal is y - y1 = (-1/m)(x - x1)."],
["P1","Increasing function","The graph goes up.","f is increasing where f'(x) > 0. Find f'(x), solve f'(x) > 0 and state the range of x."],
["P1","Integration with boundary condition","Integrates and leaves out + c.","y = integral of f'(x) dx = ... + c. Substitute the given point to find c, then write the equation of the curve in full."],
["P1","Area under a curve","Subtracts numbers without saying why.","Area = integral from a to b of y dx = [F(x)] from a to b = F(b) - F(a). Show the substitution of both limits and give the answer with units if given."],
["P1","Area between a curve and a line","Takes the area of each part without comment.","Find the intersection points to give the limits. Area = integral of (top curve - bottom curve) dx between the limits. If a region is below the x-axis, treat it separately and use its positive value."],
["P1","Hidden quadratic (exponential)","Cannot start.","Let y = 2^x so the equation becomes y^2 - 5y + 4 = 0. Solve for y, then solve 2^x = y for each value, rejecting any y <= 0."],
["P1","Solve a^x = b","Guesses the power.","Take logs of both sides: x log a = log b, so x = log b / log a. Give the answer to the required accuracy."],
["P1","Laws of logs","Cancels the logs.","log a + log b = log(ab); log a - log b = log(a/b); k log a = log(a^k). State the law used on each line."],
["P1","Exponential model","Gives the number only.","Use y = a b^t or y = a e^(kt). Take logs to find a straight line, interpret the gradient and intercept, and state the answer in context with units."],
["P1","Transformations of graphs","Says it moves.","y = f(x) + a: translation by (0, a). y = f(x + a): translation by (-a, 0). y = af(x): stretch scale factor a in the y direction. y = f(ax): stretch scale factor 1/a in the x direction. Give the full description each time."],
["P1","Trig equation in a range","Gives one solution only.","Find the principal value using the calculator, then use the symmetry of the graph for further solutions in the interval (for example 180 - x, 360 + x). List all solutions in range."],
["P1","Trig identity: tan and sin/cos","Writes tan = sin/cos sometimes.","tan x = sin x / cos x and sin^2 x + cos^2 x = 1. Use them to form an equation in one trig function."],
["P1","Binomial expansion (positive n)","Writes out terms without the formula.","(a + b)^n = a^n + nC1 a^(n-1) b + nC2 a^(n-2) b^2 + ... State the coefficient formula, simplify each term and give the expansion in ascending powers."],
["P1","Vectors: magnitude and direction","Quotes a number.","|a| = square root of (x^2 + y^2). Direction: tan(theta) = y/x. State the angle measured from the positive x-axis, or as a bearing if asked."],
["P1","Vectors: show points are collinear","Says they look in line.","Find AB and BC as vectors. AB = k BC for a scalar k, so AB is parallel to BC and, since B is common, A, B and C lie on a straight line."],
["P1","Sketching a cubic or quartic","Draws a curve.","Find intercepts with both axes, the sign of the leading coefficient for end behaviour, and repeated roots (touches the axis). Label intercepts with coordinates."],
["P2A","Factor theorem","Substitutes and says it works.","f(2) = 0, so (x - 2) is a factor of f(x) by the factor theorem."],
["P2A","Remainder theorem","Does long division only.","When f(x) is divided by (x - a) the remainder is f(a). Substitute x = a and give the remainder."],
["P2A","Algebraic division","Gets the quotient wrong.","Divide f(x) by (x - a) to obtain quotient Q(x) and remainder R, so f(x) = (x - a)Q(x) + R. Show each subtraction line."],
["P2A","Proof by contradiction","Assumes the opposite without saying.","Assume the statement is false, that is suppose root 2 is rational, root 2 = a/b with no common factor. Derive a contradiction, so the assumption is false and root 2 is irrational."],
["P2A","Partial fractions","Splits with no method.","Write (3x + 1)/((x - 1)(x + 2)) = A/(x - 1) + B/(x + 2). Multiply through to get 3x + 1 = A(x + 2) + B(x - 1). Substitute x = 1 and x = -2 to find A and B."],
["P2A","Domain and range","Says all numbers.","Domain: the set of permitted input values of x. Range: the set of output values f(x). State both using inequalities, for example domain x >= 0, range f(x) >= 3."],
["P2A","Composite functions","Multiplies the functions.","fg(x) means f(g(x)): substitute g(x) into f. Evaluate g first, then f. fg and gf are not generally the same."],
["P2A","Inverse function","Swaps x and y without a rule.","Let y = f(x), make x the subject, then replace y by x to give f^-1(x). The domain of f^-1 is the range of f. The graph is a reflection in y = x."],
["P2A","Modulus equation","Gives only one solution.","|f(x)| = k means f(x) = k or f(x) = -k. Solve both, check each solution in the original equation and reject any that fail."],
["P2A","Modulus graph","Draws the curve as is.","y = |f(x)|: reflect in the x-axis any part below the axis. Mark intercepts and keep the original part above the axis unchanged."],
["P2A","Arithmetic series","Uses a formula without defining.","For an arithmetic sequence with first term a and common difference d: u_n = a + (n - 1)d and S_n = n/2 [2a + (n - 1)d] = n/2 (a + l). Define a, d and n first."],
["P2A","Geometric series","Mixes up r.","First term a, common ratio r = u2/u1. u_n = a r^(n-1), S_n = a(1 - r^n)/(1 - r). Sum to infinity S = a/(1 - r), valid only if |r| < 1."],
["P2A","Sigma notation","Treats it as a list.","The sum of u_r from r = 1 to n. Identify the sequence type, use the standard formula, and substitute the limits."],
["P2A","Recurrence relation","Finds the next term only.","u(n+1) = f(u(n)). Substitute the first term to give u2, then u3 and so on, showing each step. For periodic or increasing sequences state the pattern."],
["P2A","Series in context","Gives the number.","Define the first term and the common difference or ratio in context, form an equation, solve it and state the answer with the meaning: The savings first exceed 5000 pounds in year 8."],
["P2A","Binomial expansion (any n)","Uses nCr for negative n.","(1 + x)^n = 1 + nx + n(n-1)/2! x^2 + n(n-1)(n-2)/3! x^3 + ... for any rational n. Valid for |x| < 1. Write each term with its factorial and simplify."],
["P2A","Validity of an expansion","Says it works for all x.","The expansion of (1 + ax)^n is valid when |ax| < 1, so |x| < 1/|a|. State the inequality for the bracket you used."],
["P2A","Binomial and partial fractions","Expands the whole fraction.","Split into partial fractions, expand each term with the binomial series, add like terms, and state the overall validity as the narrower of the ranges."],
["P2A","Approximate a value","Uses a calculator only.","Choose x so that the expression equals the required value, check it satisfies the validity condition, substitute into the series and say the result is an approximation."],
["P2B","Arc length and sector area","Uses degrees.","With theta in radians, s = r theta and A = 1/2 r^2 theta. State the unit."],
["P2B","Segment area","Subtracts without naming.","Area of segment = area of sector - area of triangle = 1/2 r^2 theta - 1/2 r^2 sin theta."],
["P2B","Small angle approximations","Replaces sin x by x everywhere.","For small x in radians: sin x is approximately x, cos x is approximately 1 - x^2/2, tan x is approximately x."],
["P2B","sec, cosec, cot","Does not convert.","sec x = 1/cos x, cosec x = 1/sin x, cot x = cos x / sin x. Rewrite the equation using these and solve."],
["P2B","Identities with sec and cosec","Cannot start the equation.","1 + tan^2 x = sec^2 x and 1 + cot^2 x = cosec^2 x. Use one to form a quadratic in a single trig function, factorise and solve."],
["P2B","Inverse trig range","Ignores restrictions.","arcsin x has range -pi/2 to pi/2, arccos x has range 0 to pi, arctan x has range -pi/2 to pi/2. Domain of arcsin and arccos is -1 <= x <= 1."],
["P2B","Prove a trig identity","Works on both sides.","Start with the left-hand side only. Use the stated identities, simplify line by line to the right-hand side and write = RHS."],
["P2B","Compound angle","sin(A + B) = sin A + sin B.","sin(A + B) = sin A cos B + cos A sin B; cos(A + B) = cos A cos B - sin A sin B. Substitute known exact values and simplify."],
["P2B","Double angle","Picks a form at random.","sin 2x = 2 sin x cos x; cos 2x = cos^2 x - sin^2 x = 2cos^2 x - 1 = 1 - 2 sin^2 x. State which form is used and why."],
["P2B","R sin(x + alpha)","States R and alpha only.","Write a sin x + b cos x = R sin(x + alpha) = R sin x cos alpha + R cos x sin alpha. Compare: R cos alpha = a and R sin alpha = b, so R = square root of (a^2 + b^2), tan alpha = b/a."],
["P2B","Maximum value from R sin(x + alpha)","Gives the value only.","The maximum is R when sin(x + alpha) = 1, so x + alpha = 90 degrees. The minimum is -R when sin(x + alpha) = -1. State both the value and the x at which it occurs."],
["P2B","Trig modelling","Gives a bare number.","Substitute into the model, solve, and answer in context: The maximum depth is 7.2 m at 14:30. R is the amplitude, period = 360/k (or 2pi/k)."],
["P2B","Parametric to Cartesian","Gives an unsimplified relation.","Eliminate the parameter: make t the subject of one equation and substitute, or use an identity such as cos^2 t + sin^2 t = 1. State the Cartesian equation and any restriction on x or y."],
["P2B","Parametric gradient","Differentiates and does not divide.","dy/dx = (dy/dt)/(dx/dt). Substitute t for the gradient, find the point at that t, and use y - y1 = m(x - x1)."],
["P2B","Parametric area","Uses the original limits.","Change the limits to t values, then area = integral of y (dx/dt) dt between the t limits."],
["P2B","Chain rule","Differentiates the outside only.","Let u = inner function, y = f(u). dy/dx = dy/du x du/dx. For example y = (3x + 1)^5: dy/dx = 5(3x + 1)^4 x 3 = 15(3x + 1)^4."],
["P2B","Product rule","Multiplies the derivatives.","y = uv: dy/dx = u'v + uv'. Write u, v, u' and v' first, then substitute and factorise."],
["P2B","Quotient rule","Gets the order wrong.","y = u/v: dy/dx = (u'v - uv')/v^2. Write the four parts first, then substitute."],
["P2B","Differentiate exponentials and logs","Forgets the chain rule.","d/dx(e^(kx)) = k e^(kx); d/dx(a^x) = a^x ln a; d/dx(ln x) = 1/x; d/dx(ln f(x)) = f'(x)/f(x)."],
["P2B","Differentiate trig functions","Forgets the sign or radians.","d/dx(sin x) = cos x; d/dx(cos x) = -sin x; d/dx(tan x) = sec^2 x (x in radians). Combine with the chain rule when the angle is kx."],
["P2B","Implicit differentiation","Treats y as a constant.","Differentiate each term with respect to x: d/dx(y^2) = 2y dy/dx and d/dx(xy) = y + x dy/dx. Collect dy/dx terms, factorise and make dy/dx the subject."],
["P2B","Rates of change","Works out dV/dr and stops.","State what is required (dr/dt). Use the chain rule dr/dt = dr/dV x dV/dt, substitute and give the answer in context with units."],
["P2B","Convex and concave","The curve bends.","f''(x) > 0 means convex (concave up); f''(x) < 0 means concave (concave down). A point of inflection is where f'' changes sign: show the sign change."],
["P2B","Iteration and change of sign","Gives the root only.","f(a) and f(b) have opposite signs and f is continuous, so a root lies in (a, b). Show the iteration values to the required accuracy and test an interval to justify the accuracy."],
["P2B","Integration by substitution","Does not change the limits.","Let u = g(x), find du/dx, rewrite the integral entirely in u. Change the limits to u values (or return to x at the end) and state the result."],
["P2B","Integration by parts","Chooses u at random.","integral of u dv/dx dx = uv - integral of v du/dx dx. State u, dv/dx, du/dx and v, then complete the integration and add + c."],
["P2B","Differential equation (separable)","Integrates without separating.","Separate variables: integral of 1/g(y) dy = integral of f(x) dx. Integrate both sides, add c once, and use the initial condition to find c."],
["ST","Sampling: simple random","Says it is fair.","Every member of the population has an equal chance of selection, for example numbering the sampling frame and using random numbers."],
["ST","Sampling: stratified","Takes people from each group.","The population is split into groups (strata) and a simple random sample is taken from each in proportion to the size of the stratum."],
["ST","Opportunity sampling","Says it is biased.","It uses only people who are available at that time, so the sample may not be representative of the population."],
["ST","Sample, population, census","Mixes up words.","The population is the whole set of items of interest, a sample is a subset of it, and a census observes every member of the population."],
["ST","Outliers","Any large value.","An outlier is a value above Q3 + 1.5 x IQR or below Q1 - 1.5 x IQR. Calculate both limits and compare."],
["ST","Standard deviation","The average distance from the mean.","A measure of the spread of the data about the mean; a larger value means the data are more spread out."],
["ST","Coding","Cannot interpret.","If y = (x - a)/b then mean of x = b x (mean of y) + a and SD of x = b x (SD of y). The shift does not change the spread."],
["ST","Compare two data sets","A is bigger.","Compare a measure of location and a measure of spread in context: On average, journeys in A are longer (median 24 against 19 minutes) and more varied (IQR 12 against 7 minutes)."],
["ST","Histogram","Reads height as frequency.","Frequency density = frequency / class width, so frequency = frequency density x class width (the area of the bar)."],
["ST","Correlation","There is a link.","There is a strong positive linear correlation: as x increases, y tends to increase. Correlation does not imply causation."],
["ST","Regression line meaning","Quotes the equation.","In y = a + bx, b is the average change in y for each unit increase in x, in context. a is the predicted y when x = 0 if that is meaningful."],
["ST","Interpolation and extrapolation","The prediction is OK.","Interpolation (inside the range of the data) is reliable. Extrapolation (outside the range) is unreliable because the linear relationship may not continue."],
["ST","Venn diagram and independence","Looks independent.","Events A and B are independent if P(A and B) = P(A) x P(B). Test it with the numbers and state the conclusion."],
["ST","Mutually exclusive","The events are different.","A and B are mutually exclusive if they cannot happen at the same time, so P(A and B) = 0 and P(A or B) = P(A) + P(B)."],
["ST","Conditional probability","Divides by the wrong total.","P(A | B) = P(A and B)/P(B). Identify the probabilities and substitute."],
["ST","Binomial conditions","There are two outcomes.","A fixed number of trials, two possible outcomes (success or failure), independent trials, and a constant probability of success. Relate each to the context."],
["ST","Binomial probability","Cumulative or not unclear.","Define X ~ B(n, p). Write the required probability, for example P(X <= 4), and use P(X > 4) = 1 - P(X <= 4)."],
["ST","Hypothesis test: hypotheses","H0 in words only.","Define the parameter in context, then H0: p = 0.4 and H1: p > 0.4 (one-tailed). Under H0, X ~ B(20, 0.4)."],
["ST","Hypothesis test: conclusion (reject)","The claim is true.","Since 0.032 < 0.05, reject H0. There is sufficient evidence at the 5% level to suggest that the probability of germination has increased."],
["ST","Hypothesis test: conclusion (do not reject)","The claim is false.","Since 0.12 > 0.05, there is insufficient evidence to reject H0. There is no evidence that the proportion has changed."],
["ST","Critical region","States the region only.","The critical region is X >= 13 because P(X >= 13) = 0.021 < 0.05 while P(X >= 12) = 0.057 > 0.05. The actual significance level is 2.1%."],
["ST","Two-tailed test","Uses 5% in one tail.","Split the significance level equally: 2.5% in each tail. Compare each tail probability with 2.5%."],
["ST","Normal distribution","Gets z but not the link.","Define X ~ N(mu, sigma^2). Use z = (x - mu)/sigma, read the probability from the calculator, and state the final answer in context."],
["ME","Modelling: particle","Says it is a point.","The object is modelled as a particle: it has mass but its size is ignored, so rotation and air resistance are neglected."],
["ME","Modelling: light inextensible string","Says the string is weak.","A light string has negligible mass so the tension is the same throughout; inextensible means the connected particles have the same acceleration."],
["ME","Modelling: smooth","There is no friction.","The surface is smooth, so there is no friction and the only forces are the normal reaction and the others shown."],
["ME","suvat","Picks a formula randomly.","List s, u, v, a, t, mark the unknown and choose the equation that does not contain the unwanted variable. Use only for constant acceleration."],
["ME","Newton's second law","F = ma with no direction.","Resolve in the direction of motion and state it: R(up the slope) T - mg sin 30 = ma."],
["ME","Connected particles","Treats as one object.","Write an equation of motion for each particle using the same acceleration and tension, then solve simultaneously."],
["ME","Friction","F = mu R always.","F = mu R only when the particle is moving or on the point of moving; otherwise F <= mu R. Find R first by resolving perpendicular to the surface."],
["ME","Variable acceleration","Uses suvat.","suvat does not apply. v = dr/dt and a = dv/dt; integrate to go back, and use the initial conditions to find the constant."],
["ME","Velocity-time graph","Reads values.","Gradient = acceleration; area under the graph = displacement. Show areas as trapeziums with measurements."],
["ME","Direction and signs","Gets a negative answer and ignores it.","State the positive direction at the start, for example take upwards as positive so a = -9.8. A negative answer means the object moves in the opposite direction."],
["ME","Moments","Ignores a force.","Take moments about a named point: clockwise moments = anticlockwise moments. Include each force with its perpendicular distance, and state weight acts at the centre for a uniform rod."],
["ME","Equilibrium","The forces are the same.","The particle is in equilibrium, so the resultant force is zero: resolve horizontally and vertically and set each to zero."],
["ME","Mechanics answer in context","Gives a number.","State the answer in words with units and the required accuracy (g = 9.8, 2 or 3 significant figures): The particle reaches the ground after 2.3 seconds."],
["SK","Show that","Works backwards.","Start from the given information, show every step and arrive at the printed result. Do not use the printed answer in your working."],
["SK","Hence","Uses another method.","Use the previous result. Quote it: Using part (a), ..."],
["SK","Exact answer","Calculator decimal.","Leave in surds, fractions, pi or ln form, for example 3 root 2/2 or 2 ln 3."],
["SK","Proof by deduction","Tests a few numbers.","Start with a general case: an even number is 2n, an odd number is 2n + 1. Expand, simplify and conclude: this is a multiple of 2, so it is even."],
["SK","Proof by exhaustion","Lists some cases.","Split into all possible cases (n even, n odd), prove each, then state: all cases have been considered, so the statement is true."],
["SK","Disproof by counterexample","Says false.","Give one specific value and show the calculation, then state: this is a counterexample, so the statement is false."],
["SK","Check solutions","Accepts all answers.","Substitute each solution back and reject any that fail: x = 4 is rejected because ln(x - 5) is not defined."],
["SK","Rounding","Rounds early.","Keep full calculator values until the final step. Give the final answer to the accuracy required (3 significant figures by default)."],
["SK","Equals sign","Chains unequal things.","Each equals sign must connect equal quantities. Use a new line per step or the word implies."],
["SK","Conclusion in context","x = 5.","Answer in the words of the question: The shop must sell 5 items to break even. Include units."],
["SK","Sketching graphs","Draws a curve.","Label axes, intercepts with coordinates, asymptotes with equations, turning points and end behaviour."],
["SK","Notation","Leaves out dx or + c.","Integrals include dx and + c (indefinite); use brackets around negatives and show limits in square brackets."],
["SK","Range restrictions","Gives all solutions.","Check the given interval, find the principal value and use symmetry to list all solutions in range only."],
["SK","Calculator mode","Wrong mode.","Check radians or degrees before each question; radians for calculus and arc length, degrees if the angles are in degrees."],
["SK","Command words","Answers a different question.","Find: calculate with working. Show: demonstrate fully. Determine: find with justification. Explain: give reasons. Justify: give evidence for the conclusion."]
];
var KEY="mathsLangProgress";
var prog={};
try{prog=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){prog={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
function cid(i){return C[i][0]+":"+C[i][1]}

var tabKey="ALL",order=[],pos=0,flipped=false;
var tabsEl=document.getElementById("tabs"),stage=document.getElementById("stage"),countEl=document.getElementById("count");

function tabList(){
  var l=[["ALL","All"],["REV","To review"]];
  for(var k in T)l.push([k,T[k]]);
  return l;
}
function buildTabs(){
  tabsEl.innerHTML="";
  tabList().forEach(function(t){
    var b=document.createElement("div");b.className="tab"+(t[0]===tabKey?" on":"");b.textContent=t[1];
    b.onclick=function(){tabKey=t[0];pos=0;flipped=false;makeOrder();buildTabs();render()};
    tabsEl.appendChild(b);
  });
}
function makeOrder(){
  order=[];
  for(var i=0;i<C.length;i++){
    if(tabKey==="ALL"||C[i][0]===tabKey||(tabKey==="REV"&&prog[cid(i)]==="r"))order.push(i);
  }
}
function stats(){
  var k=0,r=0;
  for(var i=0;i<C.length;i++){var s=prog[cid(i)];if(s==="k")k++;else if(s==="r")r++}
  document.getElementById("known").textContent="Known "+k;
  document.getElementById("review").textContent="To review "+r;
  document.getElementById("total").textContent=C.length+" cards";
  document.getElementById("fill").style.width=(C.length?Math.round(k/C.length*100):0)+"%";
}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function render(){
  stats();stage.innerHTML="";
  if(!order.length){stage.appendChild(el("div","empty","No cards here yet. Mark some cards as Review to see them in this tab."));countEl.textContent="";return}
  if(pos>=order.length)pos=0;if(pos<0)pos=order.length-1;
  var i=order[pos],c=C[i];
  var card=el("div","card");
  card.appendChild(el("div","chip",T[c[0]]));
  var s=prog[cid(i)];
  if(s==="k")card.appendChild(el("div","mark k","Known"));
  if(s==="r")card.appendChild(el("div","mark r","Review"));
  card.appendChild(el("div","q",c[1]));
  if(!flipped){
    card.appendChild(el("div","hint","Write your full working and conclusion, then tap the card to see the full-marks write-up."));
  }else{
    var w=el("div","weak");w.appendChild(el("div","lab","Typical answer - loses marks"));w.appendChild(el("p","",c[2]));card.appendChild(w);
    var g=el("div","good");g.appendChild(el("div","lab","Full-marks write-up"));g.appendChild(el("p","",c[3]));card.appendChild(g);
  }
  card.onclick=function(){flipped=!flipped;render()};
  stage.appendChild(card);
  countEl.textContent=(pos+1)+" / "+order.length;
}
function go(d){pos+=d;flipped=false;render()}
function mark(v){
  if(!order.length)return;
  prog[cid(order[pos])]=v;save();
  if(tabKey==="REV"&&v==="k"){makeOrder();flipped=false;render();return}
  go(1);
}
document.getElementById("prev").onclick=function(){go(-1)};
document.getElementById("next").onclick=function(){go(1)};
document.getElementById("knw").onclick=function(){mark("k")};
document.getElementById("rev").onclick=function(){mark("r")};
document.getElementById("shuf").onclick=function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t}
  pos=0;flipped=false;render();
};
document.getElementById("reset").onclick=function(){
  if(confirm("Reset all progress?")){prog={};save();makeOrder();pos=0;flipped=false;render()}
};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "){e.preventDefault();flipped=!flipped;render()}
});
buildTabs();makeOrder();render();
</script>
</body>
</html>
